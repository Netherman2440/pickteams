name: Match final A browser proof
run-name: Synthetic match browser proof at ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    paths:
      - '.github/workflows/match-view-proof.yml'
      - 'app/tool/*match_view*'

permissions:
  contents: read

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record public source and runner metadata
        shell: bash
        run: |
          set -euo pipefail
          export PROOF_DIR="$RUNNER_TEMP/match-view-proof"
          printf 'PROOF_DIR=%s\n' "$PROOF_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PROOF_DIR"
          cp .github/workflows/match-view-proof.yml "$PROOF_DIR/workflow-as-executed.yml"
          cp app/tool/run_match_view_ci.sh "$PROOF_DIR/runner-as-executed.sh"
          git rev-parse HEAD > "$PROOF_DIR/source-checkout.txt"
          git status --porcelain=v1 > "$PROOF_DIR/status-checkout.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -s "$PROOF_DIR/status-checkout.txt"
          git ls-files -z | xargs -0 sha256sum > "$PROOF_DIR/inputs-checkout.sha256"
          printf 'run_id=%s\nattempt=%s\nhead_sha=%s\nrunner_os=%s\nrunner_arch=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SOURCE_SHA" "$RUNNER_OS" "$RUNNER_ARCH" > "$PROOF_DIR/run-metadata.txt"
          awk '/MemTotal:|MemAvailable:/ {print}' /proc/meminfo > "$PROOF_DIR/runner-memory.txt"
          awk '/MemTotal:/ {if ($2 < 7340032) exit 1}' /proc/meminfo
      - name: Install exact Flutter 3.47.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned synthetic capture dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r app/tool/match_view_requirements.txt 2>&1 | tee "$PROOF_DIR/python-install.log"
          python3 -m playwright install --with-deps chromium 2>&1 | tee "$PROOF_DIR/chromium-install.log"
          python3 -m pip freeze > "$PROOF_DIR/python-versions.txt"
      - name: Verify SDK, restore exact migration, build and capture
        shell: bash
        run: |
          set -euo pipefail
          bash app/tool/run_match_view_ci.sh 2>&1 | tee "$PROOF_DIR/commands.log"
      - name: Upload synthetic evidence only (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: match-view-proof-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/match-view-proof/
          if-no-files-found: error
          retention-days: 14
