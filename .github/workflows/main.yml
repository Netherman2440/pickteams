name: Main
run-name: ${{ github.actor }} is building the project.

on:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create env files
        run: |
          cat <<EOF > .env.dev
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF
          cat <<EOF > .env.prod
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the exact framework (c197ca5199e9ee5661e865596c9c07294dfab51c)
          # used by the native and browser proof lanes: the floating stable channel
          # ships Dart 3.14, whose flutter_test pins (matcher/test_api) no longer
          # resolve against the lockfile (riverpod_generator 3.0.3).
          flutter-version: '3.47.9'

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

  web-build:
    runs-on: ubuntu-latest
    needs:
      - analyze
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create env files
        run: |
          cat <<EOF > .env.dev
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF
          cat <<EOF > .env.prod
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same pinned framework as the analyze job and the native lane.
          flutter-version: '3.47.9'

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter web build
        run: flutter build web
