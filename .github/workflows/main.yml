name: Main
run-name: ${{ github.actor }} is building the project.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/tool/match_view_requirements.txt
      - name: Install tool test dependencies
        run: python3 -m pip install -r tool/match_view_requirements.txt
      - name: Test build, artifact privacy and visual-check tooling
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in sync with build_web_release.py. Floating stable breaks
          # the checked-in Dart matcher/test_api dependency resolution.
          flutter-version: '3.47.9'
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Flutter analyze
        run: flutter analyze --no-pub
      - name: Flutter test
        run: flutter test --no-pub --concurrency=1
      - name: Web-only auth regressions
        run: |
          export CHROME_EXECUTABLE="$(command -v google-chrome)"
          flutter test --no-pub --platform chrome test/widgets/auth/auth_regression_test.dart

  web-build:
    runs-on: ubuntu-latest
    needs: [analyze]
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - name: Build configured production entrypoint with pinned SDK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: PICKTEAMS_FLUTTER_ROOT="$FLUTTER_ROOT" python3 tool/build_web_release.py
      - name: Preserve public release provenance
        uses: actions/upload-artifact@v4
        with:
          name: web-release-metadata-${{ github.sha }}
          path: app/build/web/release.json
          if-no-files-found: error
