name: Main
run-name: ${{ github.actor }} is building the project.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/tool/match_view_requirements.txt
      - name: Install tool test dependencies
        run: python3 -m pip install -r tool/match_view_requirements.txt
      - name: Test build, artifact privacy and visual-check tooling
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Test Supabase tooling without a database
        run: python3 -m unittest discover -s ../supabase/tools -v
      - name: Check source branding and OAuth
        run: |
          python3 tool/check_android_branding.py
          python3 tool/check_android_oauth.py
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in sync with build_web_release.py. Floating stable breaks
          # the checked-in Dart matcher/test_api dependency resolution.
          flutter-version: '3.47.9'
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Restore only the documented SDK analyzer migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'tool')
          from release_contract import restore_analysis
          original = subprocess.check_output(['git', 'show', 'HEAD:app/analysis_options.yaml'])
          restore_analysis(Path('analysis_options.yaml'), original)
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          PY
      - name: Flutter analyze exact committed configuration
        run: |
          flutter analyze --no-pub
          git diff --exit-code
      - name: Flutter test
        run: flutter test --no-pub --coverage --concurrency=1
      - name: Preserve Flutter coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ github.sha }}
          path: app/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
      - name: Web-only auth regressions
        run: |
          export CHROME_EXECUTABLE="$(command -v google-chrome)"
          flutter test --no-pub --platform chrome test/widgets/auth/auth_regression_test.dart

  web-build:
    runs-on: ubuntu-latest
    needs: [analyze]
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      # The source gate compares HEAD with the accepted runtime ancestor.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - name: Build configured production entrypoint with pinned SDK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: PICKTEAMS_FLUTTER_ROOT="$FLUTTER_ROOT" python3 tool/build_web_release.py
      - name: Preserve public release provenance
        uses: actions/upload-artifact@v4
        with:
          name: web-release-metadata-${{ github.sha }}
          path: app/build/web/release.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve configured public web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: app/build/web/
          if-no-files-found: error
          retention-days: 7
